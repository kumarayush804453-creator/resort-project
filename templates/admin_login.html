<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Paradise Resort</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: #1e293b;
            color: #d97706;
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #d97706;
            box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15);
        }

        .btn-custom {
            background-color: #1e293b;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #d97706;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.3);
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="container p-3">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="card login-card p-4 p-md-5">
                    <!-- Brand Logo / Header -->
                    <div class="text-center">
                        <div class="brand-icon shadow-sm">
                            <i class="fa-solid fa-hotel"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Paradise Admin</h4>
                        <p class="text-muted small mb-4">Enter credentials to access dashboard</p>
                    </div>

                    <!-- Flash Notification Messages -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show rounded-3 py-2 px-3 small" role="alert">
                                    <i class="fa-solid fa-circle-info me-1"></i> {{ message }}
                                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Form -->
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">USERNAME</label>
                            <div class="input-group">
                                <input type="text" name="username" class="form-control" placeholder="Enter username" required autocomplete="off">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">PASSWORD</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-custom w-100 mb-3">
                            <i class="fa-solid fa-right-to-bracket me-2"></i> Access Dashboard
                        </button>
                        
                        <div class="text-center">
                            <a href="/" class="text-decoration-none small text-muted">
                                <i class="fa-solid fa-arrow-left me-1"></i> Return to main site
                            </a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
